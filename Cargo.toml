[workspace]
resolver = "3"
members = [ "wpdm", "wpdm-cli" , "wpdm-common"]

[workspace.dependencies]
tracing-subscriber = "0.3"
tracing = "0.1"
anyhow = "1.0"
smithay-client-toolkit = "0.20.0"
wayland-client = { version = "0.31.5", features = [ "system" ]}
image = "0.25"
clap = { version = "4.5", features = [ "derive" ] }
postcard = { version = "1.1.3", features = [ "use-std" ] }
serde = { version = "1.0", features = [ "derive" ]}
serde_json = "1.0"
wpdm-common = { path = "./wpdm-common"}
mio = { version = "1.1.1", features = [ "os-poll", "net", "os-ext" ]}
thiserror = "2.0"
rand = "0.9.2"
wgpu = { version = "30.0.1" }
pollster = { version = "1.0" }
raw-window-handle = { version = "0.6.2" }
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
strip = true
opt-level = "z"
